[package]
name = "wind-monitor"
version = "0.1.0"
edition = "2024"
description = "Watches Windguru forecasts and sends push alerts when wind criteria are met"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "signal"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
